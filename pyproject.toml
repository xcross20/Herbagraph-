[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "unit: fast tests with no database or network I/O",
    "integration: tests exercising the API/DB with mocked external services",
    "live: optional smoke against a running Docker stack (HERBAGRAPH_LIVE_E2E=1)",
    "playwright: optional browser UI smoke (HERBAGRAPH_PLAYWRIGHT=1)",
    "mvp_red: expected-failure Discovery integrity tests; unexpected pass fails CI",
    "mvp_scaffold: contract scaffolding; not a reproduced defect",
    "requires_postgres: uniqueness/concurrency; skipped on SQLite",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
concurrency = ["greenlet", "thread"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy 2.0 `Mapped["ClassName"]` forward refs resolve via the shared declarative
# registry at mapper-configure time, not via module-local name lookup -- ruff can't see that.
"app/models/*.py" = ["F821"]
"scripts/agent_protocol/run_architect.py" = ["E402"]
"scripts/agent_protocol/run_correct.py" = ["E402"]
"scripts/agent_protocol/dry_run.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.models.*"
disable_error_code = ["name-defined"]
