# Cloud PMID growth — runs on GitHub, independent of your laptop.
#
# Target: ~100–200 real PubMed-backed claims per day for claim-less catalog interventions.
# Never invents PMIDs: only writes claims when a PubMed title matches intervention keywords.
#
# Manual run: Actions → "PMID growth (cloud)" → Run workflow → set limit (100–200).

name: PMID growth (cloud)

on:
  schedule:
    # 14:00 UTC daily (~9–10am US Central depending on DST)
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Target accepted claims this run (100–200 recommended)"
        required: true
        default: "150"
      dry_run:
        description: "Dry run (search only, no file write)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pmid-growth
  cancel-in-progress: false

jobs:
  grow-pmids:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # Minimal deps for catalog imports + SSL
          pip install -r requirements.txt
          pip install certifi

      - name: Resolve batch size
        id: batch
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            LIMIT="${{ github.event.inputs.limit }}"
            DRY="${{ github.event.inputs.dry_run }}"
          else
            LIMIT="150"
            DRY="false"
          fi
          # Clamp 50–200 for safety
          if [ "$LIMIT" -lt 50 ]; then LIMIT=50; fi
          if [ "$LIMIT" -gt 200 ]; then LIMIT=200; fi
          echo "limit=$LIMIT" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY" >> "$GITHUB_OUTPUT"
          echo "Batch limit=$LIMIT dry_run=$DRY"

      - name: Run PMID growth batch
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          # Avoid loading full app settings that need DB
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          SECRET_KEY: ci-pmid-growth-secret-key-not-for-prod-0123456789
          ENCRYPTION_KEY: unused-ci-placeholder
          OPENAI_API_KEY: test-openai-api-key
          SIGNUP_ACCESS_CODE: ""
        run: |
          set -euo pipefail
          export NCBI_EMAIL="${NCBI_EMAIL:-ci@herbagraph.io}"
          FLAGS=(--limit "${{ steps.batch.outputs.limit }}" --json-out ops/pmid_growth_last_run.json)
          if [ "${{ steps.batch.outputs.dry_run }}" = "true" ]; then
            FLAGS+=(--dry-run)
          else
            FLAGS+=(--write)
          fi
          python scripts/pmid_growth_batch.py "${FLAGS[@]}"
          echo "---- summary ----"
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("ops/pmid_growth_last_run.json")
          if p.is_file():
              d = json.loads(p.read_text())
              for k in ("accepted","written","skipped","elapsed_seconds","seconds_per_accepted","est_seconds_for_100_accepted"):
                  print(f"{k}: {d.get(k)}")
          PY

      - name: Integrity gates (when claims written)
        if: steps.batch.outputs.dry_run != 'true'
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          SECRET_KEY: ci-pmid-growth-secret-key-not-for-prod-0123456789
          ENCRYPTION_KEY: unused-ci-placeholder
          OPENAI_API_KEY: test-openai-api-key
          SIGNUP_ACCESS_CODE: ""
          HERBAGRAPH_PMID_AUDIT_STRICT: "0"
        run: |
          set -euo pipefail
          python scripts/audit_pmid_integrity.py
          python scripts/audit_evidence_gaps.py
          python scripts/validate_seed_counts.py

      - name: Open pull request
        if: steps.batch.outputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            chore(evidence): cloud PMID growth batch

            Automated PubMed-backed claims for claim-less catalog interventions.
            Generated by scripts/pmid_growth_batch.py (never invents PMIDs).
          title: "chore(evidence): daily PMID growth batch"
          body: |
            ## Cloud PMID growth

            Automated batch from workflow **PMID growth (cloud)**.

            - Target limit: `${{ steps.batch.outputs.limit }}`
            - Summary: see `ops/pmid_growth_last_run.json` in this PR
            - Gates: `audit_pmid_integrity`, `audit_evidence_gaps`, `validate_seed_counts`

            **Review tips**
            - Skim new rows in `app/knowledge_graph/generated_pmid_claims.py`
            - Spot-check a few PMIDs on PubMed
            - Merge when satisfied; reseed not required for code-side routing

            Optional strict audit after merge (local/network):
            ```bash
            HERBAGRAPH_PMID_AUDIT_STRICT=1 python3 scripts/audit_pmid_integrity.py
            ```
          branch: chore/pmid-growth-auto
          delete-branch: true
          labels: |
            evidence
            automated
