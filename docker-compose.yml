services:
  db:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: herbagraph
      POSTGRES_PASSWORD: herbagraph
      POSTGRES_DB: herbagraph
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    env_file: .env
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    volumes:
      - .:/srv
      - uploads:/tmp/herbagraph/uploads

  worker:
    build: .
    env_file: .env
    depends_on:
      - db
      - redis
    command: celery -A app.workers.celery_app worker --loglevel=info --autoreload
    volumes:
      - .:/srv
      - uploads:/tmp/herbagraph/uploads

volumes:
  pgdata:
  uploads:
