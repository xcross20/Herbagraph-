<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account — HerbaGraph</title>
<link rel="stylesheet" href="/css/site.css">
</head>
<body class="auth-page">
<aside class="auth-brand">
  <div>
    <a class="logo" href="/">
      <svg class="logo-mark on-ink" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M5 22 L13 14 L20 18 L27 8" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><circle cx="5" cy="22" r="2.25" fill="currentColor"/><circle cx="13" cy="14" r="2.25" fill="currentColor"/><circle cx="20" cy="18" r="2.25" fill="currentColor"/><circle cx="27" cy="8" r="2.75" fill="#2f7df6"/></svg>
      <span class="logo-word">HerbaGraph</span>
    </a>
    <p class="on-ink-label">On ink</p>
    <h2>Start with explainable reports</h2>
    <p class="brand-copy">Create a workspace for integrated lab analysis and clinical priority scoring.</p>
  </div>
  <p class="brand-copy" style="font-size:0.82rem">For licensed practitioners and researchers.</p>
</aside>
<div class="auth-form-wrap">
  <div>
    <div class="mobile-logo">
      <a class="logo" href="/">
        <svg class="logo-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M5 22 L13 14 L20 18 L27 8" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><circle cx="5" cy="22" r="2.25" fill="currentColor"/><circle cx="13" cy="14" r="2.25" fill="currentColor"/><circle cx="20" cy="18" r="2.25" fill="currentColor"/><circle cx="27" cy="8" r="2.75" fill="#2f7df6"/></svg>
        <span class="logo-word">HerbaGraph</span>
      </a>
    </div>
    <div class="card">
      <h1>Create account</h1>
      <p class="muted">Set up your HerbaGraph workspace</p>
      <div id="auth-error" class="error"></div>
      <div class="form-row"><label for="auth-name">Full name (optional)</label><input id="auth-name" type="text" autocomplete="name"></div>
      <div class="form-row"><label for="auth-email">Email</label><input id="auth-email" type="email" autocomplete="email" required></div>
      <div class="form-row"><label for="auth-password">Password</label><input id="auth-password" type="password" autocomplete="new-password" required minlength="8"></div>
      <div class="actions" style="margin-top:0.5rem">
        <button class="btn primary" id="signup-btn" type="button">Create account</button>
      </div>
      <p class="auth-links"><a href="/login.html">Already have an account? Sign in</a></p>
      <p id="auth-hint" class="muted" style="margin-top:0.75rem"></p>
    </div>
  </div>
</div>
<script src="/js/herbagraph-auth.js"></script>
<script>
const Auth = window.HerbaGraphAuth;
function showError(msg, kind) {
  const el = document.getElementById("auth-error");
  el.textContent = msg;
  el.className = kind === "ok" ? "success" : "error";
}
async function init() {
  if (window.__hgAuthRedirecting) return;
  if (await Auth.ensureSession()) { location.href = "/app.html#dashboard"; return; }
  const cfg = await Auth.loadConfig();
  document.getElementById("auth-hint").textContent = cfg.auth_provider === "supabase"
    ? "You may need to verify your email before signing in."
    : "Local sandbox registration. No email verification required.";
}
document.getElementById("signup-btn").onclick = async () => {
  showError("");
  try {
    await Auth.signUp(
      document.getElementById("auth-email").value.trim(),
      document.getElementById("auth-password").value,
      document.getElementById("auth-name").value.trim() || null
    );
    location.href = "/app.html#dashboard";
  } catch (e) {
    showError(e.message, e.message.includes("Check your email") ? "ok" : undefined);
  }
};
init();
</script>
</body>
</html>
