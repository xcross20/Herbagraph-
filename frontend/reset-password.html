<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set new password — HerbaGraph</title>
<link rel="stylesheet" href="/css/site.css">
</head>
<body class="auth-page">
<aside class="auth-brand">
  <div>
    <a class="logo" href="/">
      <svg class="logo-mark on-ink" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M5 22 L13 14 L20 18 L27 8" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><circle cx="5" cy="22" r="2.25" fill="currentColor"/><circle cx="13" cy="14" r="2.25" fill="currentColor"/><circle cx="20" cy="18" r="2.25" fill="currentColor"/><circle cx="27" cy="8" r="2.75" fill="#2f7df6"/></svg>
      <span class="logo-word">HerbaGraph</span>
    </a>
    <h2>Choose a new password</h2>
    <p class="brand-copy">Complete your reset to sign in again.</p>
  </div>
</aside>
<div class="auth-form-wrap">
  <div>
    <div class="mobile-logo">
      <a class="logo" href="/"><svg class="logo-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M5 22 L13 14 L20 18 L27 8" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><circle cx="5" cy="22" r="2.25" fill="currentColor"/><circle cx="13" cy="14" r="2.25" fill="currentColor"/><circle cx="20" cy="18" r="2.25" fill="currentColor"/><circle cx="27" cy="8" r="2.75" fill="#2f7df6"/></svg><span class="logo-word">HerbaGraph</span></a>
    </div>
    <div class="card">
      <h1>New password</h1>
      <p class="muted">At least 8 characters</p>
      <div id="auth-error" class="error"></div>
      <div class="form-row"><label for="new-password">New password</label><input id="new-password" type="password" autocomplete="new-password" required minlength="8"></div>
      <div class="form-row"><label for="confirm-password">Confirm password</label><input id="confirm-password" type="password" autocomplete="new-password" required minlength="8"></div>
      <div class="actions" style="margin-top:0.5rem">
        <button class="btn primary" id="save-btn" type="button">Update password</button>
      </div>
      <p class="auth-links"><a href="/login.html">Back to sign in</a></p>
    </div>
  </div>
</div>
<script src="/js/herbagraph-auth.js"></script>
<script>
const Auth = window.HerbaGraphAuth;
function showMessage(msg, kind) {
  const el = document.getElementById("auth-error");
  el.textContent = msg;
  el.className = kind === "ok" ? "success" : "error";
}
async function init() {
  if (window.__hgAuthRedirecting) return;
  const wasCallback = await Auth.handleAuthRedirect();
  if (!wasCallback && !(await Auth.ensureSession())) {
    showMessage("This reset link is invalid or has expired.");
    document.getElementById("save-btn").disabled = true;
  }
}
document.getElementById("save-btn").onclick = async () => {
  showMessage("");
  const pw = document.getElementById("new-password").value;
  const confirm = document.getElementById("confirm-password").value;
  if (pw.length < 8) { showMessage("Password must be at least 8 characters."); return; }
  if (pw !== confirm) { showMessage("Passwords do not match."); return; }
  try {
    await Auth.updatePassword(pw);
    await Auth.signOut();
    showMessage("Password updated. Redirecting…", "ok");
    setTimeout(() => { location.href = "/login.html"; }, 1200);
  } catch (e) { showMessage(e.message); }
};
init();
</script>
</body>
</html>
