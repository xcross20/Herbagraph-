<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set new password — HerbaGraph</title>
<link rel="stylesheet" href="/css/site.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="/">HerbaGraph</a>
  <nav class="nav-actions">
    <a class="btn" href="/login.html">Sign in</a>
  </nav>
</header>
<main class="shell-narrow">
  <div class="card">
    <h1>Choose a new password</h1>
    <p class="muted">Complete your password reset to sign in again.</p>
    <div id="auth-error" class="error"></div>
    <div class="form-row"><label for="new-password">New password</label><input id="new-password" type="password" autocomplete="new-password" required minlength="8"></div>
    <div class="form-row"><label for="confirm-password">Confirm password</label><input id="confirm-password" type="password" autocomplete="new-password" required minlength="8"></div>
    <div class="actions" style="display:flex;flex-wrap:wrap;gap:0.5rem;margin-top:0.5rem">
      <button class="btn primary" id="save-btn" type="button">Update password</button>
    </div>
    <p class="auth-links">
      <a href="/login.html">Back to sign in</a>
    </p>
  </div>
</main>
<script src="/js/herbagraph-auth.js"></script>
<script>
const Auth = window.HerbaGraphAuth;

function showMessage(msg, kind) {
  const el = document.getElementById("auth-error");
  el.textContent = msg;
  el.className = kind === "ok" ? "success" : "error";
}

async function init() {
  if (window.__hgAuthRedirecting) return;
  const wasCallback = await Auth.handleAuthRedirect();
  if (!wasCallback && !(await Auth.ensureSession())) {
    showMessage("This reset link is invalid or has expired. Request a new one from the forgot password page.");
    document.getElementById("save-btn").disabled = true;
  }
}

document.getElementById("save-btn").onclick = async () => {
  showMessage("");
  const pw = document.getElementById("new-password").value;
  const confirm = document.getElementById("confirm-password").value;
  if (pw.length < 8) {
    showMessage("Password must be at least 8 characters.");
    return;
  }
  if (pw !== confirm) {
    showMessage("Passwords do not match.");
    return;
  }
  try {
    await Auth.updatePassword(pw);
    await Auth.signOut();
    showMessage("Password updated. Redirecting to sign in…", "ok");
    setTimeout(() => { location.href = "/login.html"; }, 1200);
  } catch (e) {
    showMessage(e.message);
  }
};

init();
</script>
</body>
</html>
