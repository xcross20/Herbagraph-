<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Validation — HerbaGraph Admin</title>
<link rel="stylesheet" href="/css/site.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">
<header class="admin-header">
  <a class="logo" href="/admin/">
    <svg class="logo-mark on-ink" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M5 22 L13 14 L20 18 L27 8" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><circle cx="5" cy="22" r="2.25" fill="currentColor"/><circle cx="13" cy="14" r="2.25" fill="currentColor"/><circle cx="20" cy="18" r="2.25" fill="currentColor"/><circle cx="27" cy="8" r="2.75" fill="#2f7df6"/></svg>
    <span class="logo-word">HerbaGraph</span>
  </a>
  <nav class="admin-nav">
    <a href="/admin/">Home</a>
    <a href="/admin/users.html">Users</a>
    <a href="/admin/validation.html" class="active">Validation</a>
  </nav>
  <button class="btn" type="button" id="logout-btn" style="background:#1f2937;color:#fff;border-color:#374151">Sign out</button>
</header>
<main class="admin-shell">
  <h1>Validation dashboard</h1>
  <p class="muted">Clinician feedback and product analytics. Not shown on patient reports.</p>
  <p id="status" class="admin-status">Loading…</p>
  <button class="btn primary" id="refresh-btn" type="button">Refresh</button>
  <div id="metrics" class="metric-grid"></div>
  <div id="dashboard"></div>
</main>
<script src="/js/admin-auth.js"></script>
<script>
const Admin = window.HerbaGraphAdminAuth;
document.getElementById("logout-btn").onclick = () => Admin.logout();
if (!Admin.requireAuth()) throw new Error("redirect");

function esc(s) { return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function renderDashboard(data) {
  document.getElementById("metrics").innerHTML = `
    <div class="metric-card"><strong>${data.reports_generated}</strong><span>Reports generated</span></div>
    <div class="metric-card"><strong>${data.reports_reviewed}</strong><span>Reports reviewed</span></div>
    <div class="metric-card"><strong>${data.average_trust_score != null ? data.average_trust_score + "/5" : "—"}</strong><span>Average trust</span></div>
    <div class="metric-card"><strong>${data.average_usefulness_score != null ? data.average_usefulness_score + "/5" : "—"}</strong><span>Average usefulness</span></div>`;
  let html = `<h2 style="margin-top:1.5rem">Section insights</h2>`;
  html += `<p><strong>Most helpful:</strong> ${esc(data.most_useful_section || "—")}${data.most_useful_section_percent != null ? ` (${data.most_useful_section_percent}%)` : ""}</p>`;
  html += `<p><strong>Least helpful:</strong> ${esc(data.least_useful_section || "—")}${data.least_useful_section_percent != null ? ` (${data.least_useful_section_percent}%)` : ""}</p>`;
  html += `<h2>Most requested biomarkers</h2><ul>`;
  for (const row of data.most_requested_biomarkers || []) html += `<li>${esc(row.biomarker_name)} (${row.count})</li>`;
  if (!(data.most_requested_biomarkers || []).length) html += `<li>—</li>`;
  html += `</ul><h2>Disputed recommendations</h2><ul>`;
  for (const row of data.disputed_recommendations || []) html += `<li>${esc(row.intervention_name)} (${row.low_agreement_count} low-agreement)</li>`;
  if (!(data.disputed_recommendations || []).length) html += `<li>—</li>`;
  html += `</ul><h2>Free-text feedback</h2>`;
  for (const row of data.free_text_feedback || []) html += `<div class="comment">"${esc(row.text)}"</div>`;
  if (!(data.free_text_feedback || []).length) html += `<p class="muted">—</p>`;
  document.getElementById("dashboard").innerHTML = html;
}

async function loadDashboard() {
  const status = document.getElementById("status");
  status.textContent = "Loading…";
  status.className = "admin-status";
  try {
    const resp = await Admin.api("/api/v1/admin/validation/dashboard");
    if (!resp.ok) throw new Error(await resp.text());
    renderDashboard(await resp.json());
    status.textContent = "Updated " + new Date().toLocaleString();
    status.className = "admin-status ok";
  } catch (err) {
    status.textContent = String(err.message || err);
    status.className = "admin-status error";
  }
}
document.getElementById("refresh-btn").onclick = loadDashboard;
loadDashboard();
</script>
</body>
</html>
