<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin sign in — HerbaGraph</title>
<link rel="stylesheet" href="/css/site.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div class="admin-gate">
  <aside class="admin-gate-brand">
    <div>
      <a class="logo" href="/">
        <svg class="logo-mark on-ink" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M5 22 L13 14 L20 18 L27 8" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><circle cx="5" cy="22" r="2.25" fill="currentColor"/><circle cx="13" cy="14" r="2.25" fill="currentColor"/><circle cx="20" cy="18" r="2.25" fill="currentColor"/><circle cx="27" cy="8" r="2.75" fill="#2f7df6"/></svg>
        <span class="logo-word">HerbaGraph</span>
      </a>
      <span class="admin-badge" style="display:inline-block;margin-top:1rem">Operator console</span>
      <h1 style="margin-top:1.5rem">Master access</h1>
      <p class="brand-copy" style="color:#9ca3af;max-width:34ch">Password-protected admin for user management, validation analytics, and production operations.</p>
    </div>
    <p style="font-size:0.82rem;color:#6b7280">Not for patient-facing use.</p>
  </aside>
  <div class="admin-gate-form">
    <div class="card" style="width:100%;max-width:400px">
      <h1>Admin password</h1>
      <p class="muted">Enter the operator master password configured in production.</p>
      <div id="auth-error" class="error"></div>
      <div class="form-row"><label for="admin-password">Master password</label><input id="admin-password" type="password" autocomplete="current-password" required></div>
      <div class="actions" style="margin-top:0.5rem">
        <button class="btn primary" id="login-btn" type="button">Unlock console</button>
      </div>
      <p class="auth-links"><a href="/">← Public site</a></p>
    </div>
  </div>
</div>
<script src="/js/admin-auth.js"></script>
<script>
const Admin = window.HerbaGraphAdminAuth;
const params = new URLSearchParams(location.search);
const nextUrl = params.get("next") || "/admin/";

function showError(msg) {
  document.getElementById("auth-error").textContent = msg;
}

if (Admin.isAuthed()) location.href = nextUrl;

document.getElementById("login-btn").onclick = async () => {
  showError("");
  try {
    await Admin.login(document.getElementById("admin-password").value);
    location.href = nextUrl;
  } catch (e) {
    try {
      const j = JSON.parse(e.message);
      showError(j.detail || e.message);
    } catch {
      showError(e.message);
    }
  }
};
document.getElementById("admin-password").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("login-btn").click();
});
</script>
</body>
</html>
