<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — HerbaGraph</title>
<link rel="stylesheet" href="/css/site.css">
</head>
<body class="auth-page">
<aside class="auth-brand">
  <div>
    <a class="logo" href="/">
      <svg class="logo-mark on-ink" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M5 22 L13 14 L20 18 L27 8" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><circle cx="5" cy="22" r="2.25" fill="currentColor"/><circle cx="13" cy="14" r="2.25" fill="currentColor"/><circle cx="20" cy="18" r="2.25" fill="currentColor"/><circle cx="27" cy="8" r="2.75" fill="#2f7df6"/></svg>
      <span class="logo-word">HerbaGraph</span>
    </a>
    <h2>Your clinical workspace awaits</h2>
    <p class="brand-copy">Sign in to manage patients, upload labs, and open evidence-graded reports.</p>
  </div>
  <p class="brand-copy" style="font-size:0.82rem">Research tool, not medical advice.</p>
</aside>
<div class="auth-form-wrap">
  <div>
    <div class="mobile-logo">
      <a class="logo" href="/">
        <svg class="logo-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M5 22 L13 14 L20 18 L27 8" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><circle cx="5" cy="22" r="2.25" fill="currentColor"/><circle cx="13" cy="14" r="2.25" fill="currentColor"/><circle cx="20" cy="18" r="2.25" fill="currentColor"/><circle cx="27" cy="8" r="2.75" fill="#2f7df6"/></svg>
        <span class="logo-word">HerbaGraph</span>
      </a>
    </div>
    <div class="card">
      <h1>Sign in</h1>
      <p class="muted">Access your workspace</p>
      <div id="auth-error" class="error"></div>
      <div class="form-row"><label for="auth-email">Email</label><input id="auth-email" type="email" autocomplete="email" required></div>
      <div class="form-row"><label for="auth-password">Password</label><input id="auth-password" type="password" autocomplete="current-password" required></div>
      <div class="actions" style="margin-top:0.5rem">
        <button class="btn primary" id="login-btn" type="button">Sign in</button>
        <button class="btn hidden" id="guest-btn" type="button">Continue as guest</button>
      </div>
      <p class="auth-links">
        <a href="/forgot-password.html">Forgot password?</a>
        <a href="/signup.html">Create account</a>
      </p>

    </div>
  </div>
</div>
<script src="/js/herbagraph-auth.js"></script>
<script>
const Auth = window.HerbaGraphAuth;
const params = new URLSearchParams(location.search);
const nextUrl = params.get("next") || "/app.html#dashboard";
function showError(msg, kind) {
  const el = document.getElementById("auth-error");
  el.textContent = msg;
  el.className = kind === "ok" ? "success" : "error";
}
async function init() {
  if (window.__hgAuthRedirecting) return;
  if (await Auth.handleAuthRedirect()) { location.href = nextUrl; return; }
  if (await Auth.ensureSession()) { location.href = nextUrl; return; }
  const cfg = await Auth.loadConfig();
  document.getElementById("guest-btn").classList.toggle("hidden", !cfg.allow_guest_auth);
}
document.getElementById("login-btn").onclick = async () => {
  showError("");
  try {
    await Auth.signInWithPassword(
      document.getElementById("auth-email").value.trim(),
      document.getElementById("auth-password").value
    );
    location.href = nextUrl;
  } catch (e) { showError(e.message); }
};
document.getElementById("guest-btn").onclick = async () => {
  showError("");
  try { await Auth.continueAsGuest(); location.href = nextUrl; }
  catch (e) { showError(e.message); }
};
document.getElementById("auth-password").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("login-btn").click();
});
init();
</script>
</body>
</html>
