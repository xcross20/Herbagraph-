<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HerbaGraph Workspace</title>
<link rel="stylesheet" href="/css/site.css">
<script src="/js/herbagraph-auth.js"></script>
<script src="/js/workspace-home.js"></script>
</head>
<body>
<p style="font-family:system-ui,sans-serif;padding:2rem;color:#555">Opening your portal…</p>
<script>
(async function () {
  const WS = window.HerbaGraphWorkspace;
  const hash = location.hash || "#dashboard";
  const onboard = new URLSearchParams(location.search).get("onboard") === "1";
  const home = await WS.homeForCurrentSession({ hash, onboard });
  location.replace(home);
})();
</script>
</body>
</html>
