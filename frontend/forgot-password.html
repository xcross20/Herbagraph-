<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password — HerbaGraph</title>
<link rel="stylesheet" href="/css/site.css">
</head>
<body>
<header class="site-header">
  <div>
    <a class="brand" href="/">HerbaGraph</a>
    <span class="brand-tag">AI Clinical Reasoning for Precision Nutrition</span>
  </div>
  <nav class="nav-actions">
    <a class="btn" href="/login.html">Sign in</a>
  </nav>
</header>
<main class="shell-narrow">
  <div class="card">
    <h1>Reset password</h1>
    <p class="muted">Enter your email and we'll send a link to choose a new password.</p>
    <div id="auth-error" class="error"></div>
    <div class="form-row"><label for="auth-email">Email</label><input id="auth-email" type="email" autocomplete="email" required></div>
    <div class="actions" style="display:flex;flex-wrap:wrap;gap:0.5rem;margin-top:0.5rem">
      <button class="btn primary" id="reset-btn" type="button">Send reset link</button>
    </div>
    <p class="auth-links">
      <a href="/login.html">Back to sign in</a>
    </p>
    <p id="auth-hint" class="muted" style="margin-top:0.75rem"></p>
  </div>
  <p class="disclaimer-foot" style="margin-top:1.5rem">
    Research tool, not medical advice.
  </p>
</main>
<script src="/js/herbagraph-auth.js"></script>
<script>
const Auth = window.HerbaGraphAuth;

function showMessage(msg, kind) {
  const el = document.getElementById("auth-error");
  el.textContent = msg;
  el.className = kind === "ok" ? "success" : "error";
}

async function init() {
  const cfg = await Auth.loadConfig();
  const hint = document.getElementById("auth-hint");
  if (cfg.auth_provider !== "supabase") {
    hint.textContent = "Password reset requires Supabase Auth (AUTH_PROVIDER=supabase).";
    document.getElementById("reset-btn").disabled = true;
  }
}

document.getElementById("reset-btn").onclick = async () => {
  showMessage("");
  try {
    const email = document.getElementById("auth-email").value.trim();
    if (!email) throw new Error("Enter your email address.");
    await Auth.resetPassword(email);
    showMessage("Password reset email sent. Check your inbox.", "ok");
  } catch (e) {
    showMessage(e.message);
  }
};

init();
</script>
</body>
</html>
