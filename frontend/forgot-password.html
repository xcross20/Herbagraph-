<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password — HerbaGraph</title>
<link rel="stylesheet" href="/css/site.css">
</head>
<body class="auth-page">
<aside class="auth-brand">
  <div>
    <a class="logo" href="/">
      <svg class="logo-mark on-ink" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M5 22 L13 14 L20 18 L27 8" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><circle cx="5" cy="22" r="2.25" fill="currentColor"/><circle cx="13" cy="14" r="2.25" fill="currentColor"/><circle cx="20" cy="18" r="2.25" fill="currentColor"/><circle cx="27" cy="8" r="2.75" fill="#2f7df6"/></svg>
      <span class="logo-word">HerbaGraph</span>
    </a>
    <h2>Reset your password</h2>
    <p class="brand-copy">We will email a secure link to choose a new password.</p>
  </div>
</aside>
<div class="auth-form-wrap">
  <div>
    <div class="mobile-logo">
      <a class="logo" href="/"><svg class="logo-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M5 22 L13 14 L20 18 L27 8" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><circle cx="5" cy="22" r="2.25" fill="currentColor"/><circle cx="13" cy="14" r="2.25" fill="currentColor"/><circle cx="20" cy="18" r="2.25" fill="currentColor"/><circle cx="27" cy="8" r="2.75" fill="#2f7df6"/></svg><span class="logo-word">HerbaGraph</span></a>
    </div>
    <div class="card">
      <h1>Forgot password</h1>
      <p class="muted">Enter your account email</p>
      <div id="auth-error" class="error"></div>
      <div class="form-row"><label for="auth-email">Email</label><input id="auth-email" type="email" autocomplete="email" required></div>
      <div class="actions" style="margin-top:0.5rem">
        <button class="btn primary" id="reset-btn" type="button">Send reset link</button>
      </div>
      <p class="auth-links"><a href="/login.html">Back to sign in</a></p>
      <p id="auth-hint" class="muted" style="margin-top:0.75rem"></p>
    </div>
  </div>
</div>
<script src="/js/herbagraph-auth.js"></script>
<script>
const Auth = window.HerbaGraphAuth;
function showMessage(msg, kind) {
  const el = document.getElementById("auth-error");
  el.textContent = msg;
  el.className = kind === "ok" ? "success" : "error";
}
async function init() {
  const cfg = await Auth.loadConfig();
  if (cfg.auth_provider !== "supabase") {
    document.getElementById("auth-hint").textContent = "Password reset requires Supabase Auth.";
    document.getElementById("reset-btn").disabled = true;
  }
}
document.getElementById("reset-btn").onclick = async () => {
  showMessage("");
  try {
    const email = document.getElementById("auth-email").value.trim();
    if (!email) throw new Error("Enter your email address.");
    await Auth.resetPassword(email);
    showMessage("Password reset email sent. Check your inbox.", "ok");
  } catch (e) { showMessage(e.message); }
};
init();
</script>
</body>
</html>
